name: CI

on:
  push:
    branches: [v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: pprepair
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install dependencies
        run: |
          conda install -y \
            cgal-cpp \
            libgdal-core-devel \
            libgdal-core \
            libgdal-arrow-parquet \
            libboost-devel \
            gmp \
            mpfr \
            cmake \
            ninja

      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PREFIX="$CONDA_PREFIX/Library"
          else
            PREFIX="$CONDA_PREFIX"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Test GeoParquet round-trip
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=build/pprepair.exe
            export GDAL_DRIVER_PATH="$CONDA_PREFIX/Library/lib/gdalplugins"
          else
            EXE=build/pprepair
            export GDAL_DRIVER_PATH="$CONDA_PREFIX/lib/gdalplugins"
          fi

          ogrinfo --formats | grep -i Parquet
          ogr2ogr -f Parquet -lco FID= build/overlap.parquet test/data/overlap.geojson
          "$EXE" -i build/overlap.parquet -o build/overlap-out.parquet -fix
          ogrinfo -so -al build/overlap-out.parquet
